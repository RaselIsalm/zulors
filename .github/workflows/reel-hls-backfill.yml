name: Reel HLS Backfill

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Backfill missing HLS encodes or inspect aggregate status.
        required: true
        type: choice
        options:
          - backfill
          - status
          - edge-smoke
      limit:
        description: Maximum videos to queue (1–200; the current legacy batch is 15).
        required: true
        default: 15
        type: number
      confirm:
        description: Enter BACKFILL_LIVE_REEL_HLS to run this production operation.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zulors-live-reel-hls-operation
  cancel-in-progress: false

jobs:
  operate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      LIVE_HOST: ${{ secrets.LIVE_HOST }}
      LIVE_USER: ${{ secrets.LIVE_USER }}
      LIVE_PORT: ${{ secrets.LIVE_PORT || '22' }}
      LIVE_PATH: ${{ secrets.LIVE_PATH }}
      LIVE_SSH_PRIVATE_KEY: ${{ secrets.LIVE_SSH_PRIVATE_KEY }}
      OPERATION: ${{ inputs.operation }}
      LIMIT: ${{ inputs.limit }}
      CONFIRMATION: ${{ inputs.confirm }}

    steps:
      - name: Check operation and deploy secrets
        run: |
          test "$CONFIRMATION" = "BACKFILL_LIVE_REEL_HLS"
          case "$OPERATION" in backfill|status|edge-smoke) ;; *) exit 1 ;; esac
          [[ "$LIMIT" =~ ^[0-9]+$ ]] && (( LIMIT >= 1 && LIMIT <= 200 ))
          test -n "$LIVE_HOST" && test -n "$LIVE_USER" && test -n "$LIVE_PATH" && test -n "$LIVE_SSH_PRIVATE_KEY"

      - name: Install live deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$LIVE_SSH_PRIVATE_KEY" > ~/.ssh/zulors_live_deploy
          chmod 600 ~/.ssh/zulors_live_deploy

      - name: Run bounded HLS operation on live
        run: |
          ssh -i ~/.ssh/zulors_live_deploy -p "$LIVE_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 "$LIVE_USER@$LIVE_HOST" \
            "bash -s -- '$LIVE_PATH' '$OPERATION' '$LIMIT'" <<'REMOTE'
          set -euo pipefail
          live_path="$1"
          operation="$2"
          limit="$3"
          cd "$live_path"

          if [[ "$operation" == "backfill" ]]; then
            php artisan media:reconcile-reel-hls --rebuild --limit="$limit" --no-ansi
            exit
          fi

          if [[ "$operation" == "edge-smoke" ]]; then
            master_url="$(php -r '
              require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              $media = \App\Models\Media::query()
                  ->where("type", \App\Enums\Media\MediaType::VIDEO->value)
                  ->where("status", \App\Enums\Media\MediaStatus::PROCESSED->value)
                  ->where("mediaable_type", \App\Models\Post::class)
                  ->where("metadata->provider", "r2")
                  ->where("metadata->playback->hls_state", "ready")
                  ->orderBy("id")
                  ->first();
              echo (string) data_get($media?->metadata, "playback.hls");
            ' )"
            test -n "$master_url"
            work_dir="$(mktemp -d)"
            trap 'rm -rf "$work_dir"' EXIT

            probe_asset() {
              local label="$1" url="$2" body="$3" headers="$4" result code ttfb bytes cache
              result="$(curl -sS --max-time 25 -D "$headers" -o "$body" -w '%{http_code} %{time_starttransfer} %{size_download}' "$url")"
              read -r code ttfb bytes <<< "$result"
              cache="$(awk 'tolower($1)=="cf-cache-status:" {gsub(/\r/, "", $2); value=$2} END {print value ? value : "missing"}' "$headers")"
              printf '%s http=%s ttfb=%ss bytes=%s cf-cache=%s\n' "$label" "$code" "$ttfb" "$bytes" "$cache"
              test "$code" = 200
            }

            probe_asset master-first "$master_url" "$work_dir/master.m3u8" "$work_dir/master.headers"
            variant_path="$(awk 'NF && $0 !~ /^#/ {print; exit}' "$work_dir/master.m3u8")"
            test -n "$variant_path"
            variant_url="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.urljoin(sys.argv[1],sys.argv[2]))' "$master_url" "$variant_path")"
            probe_asset variant-playlist "$variant_url" "$work_dir/variant.m3u8" "$work_dir/variant.headers"
            segment_path="$(awk 'NF && $0 !~ /^#/ {print; exit}' "$work_dir/variant.m3u8")"
            test -n "$segment_path"
            segment_url="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.urljoin(sys.argv[1],sys.argv[2]))' "$variant_url" "$segment_path")"
            probe_asset segment-first "$segment_url" /dev/null "$work_dir/segment-first.headers"
            probe_asset segment-repeat "$segment_url" /dev/null "$work_dir/segment-repeat.headers"
            exit
          fi

          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $items = App\Models\Media::query()
              ->where('type', App\Enums\Media\MediaType::VIDEO->value)
              ->where('status', App\Enums\Media\MediaStatus::PROCESSED->value)
              ->where('mediaable_type', App\Models\Post::class)
              ->where('metadata->provider', 'r2')
              ->get(['metadata']);
          $counts = [
              'total' => $items->count(),
              'hls_state' => ['ready' => 0, 'unset' => 0, 'queued' => 0, 'processing' => 0, 'failed' => 0, 'skipped' => 0, 'other' => 0],
              'background_state' => ['ready' => 0, 'unset' => 0, 'queued' => 0, 'processing' => 0, 'failed' => 0, 'skipped' => 0, 'other' => 0],
              'current_encoding' => 0,
          ];
          foreach ($items as $item) {
              $metadata = $item->metadata ?? [];
              foreach ([
                  'hls_state' => data_get($metadata, 'playback.hls_state'),
                  'background_state' => data_get($metadata, 'background_processing_state'),
              ] as $field => $value) {
                  $state = $value ?: 'unset';
                  $counts[$field][array_key_exists($state, $counts[$field]) ? $state : 'other']++;
              }
              if (data_get($metadata, 'playback.encoding_version') === App\Jobs\User\Timeline\GeneratePostVideoHls::ENCODING_VERSION) $counts['current_encoding']++;
          }
          echo json_encode($counts, JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR), PHP_EOL;
          PHP
          REMOTE
