name: Reel HLS Backfill

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Rebuild HLS with the current encoding version, backfill missing encodes, or inspect status.
        required: true
        type: choice
        options:
          - rebuild
          - backfill
          - status
          - edge-smoke
          - auth-smoke
          - access-audit
          - worker-audit
      limit:
        description: Maximum videos to queue (1–200; the current legacy batch is 15).
        required: true
        default: 15
        type: number
      media_ids:
        description: Optional comma-separated media IDs to rebuild/probe, or all for an edge smoke across every video.
        required: false
        type: string
      confirm:
        description: Enter BACKFILL_LIVE_REEL_HLS to run this production operation.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zulors-live-reel-hls-operation
  cancel-in-progress: false

jobs:
  operate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      LIVE_HOST: ${{ secrets.LIVE_HOST }}
      LIVE_USER: ${{ secrets.LIVE_USER }}
      LIVE_PORT: ${{ secrets.LIVE_PORT || '22' }}
      LIVE_PATH: ${{ secrets.LIVE_PATH }}
      LIVE_SSH_PRIVATE_KEY: ${{ secrets.LIVE_SSH_PRIVATE_KEY }}
      OPERATION: ${{ inputs.operation }}
      LIMIT: ${{ inputs.limit }}
      MEDIA_IDS: ${{ inputs.media_ids }}
      CONFIRMATION: ${{ inputs.confirm }}

    steps:
      - name: Check operation and deploy secrets
        run: |
          test "$CONFIRMATION" = "BACKFILL_LIVE_REEL_HLS"
          case "$OPERATION" in rebuild|backfill|status|edge-smoke|auth-smoke|access-audit|worker-audit) ;; *) exit 1 ;; esac
          [[ "$LIMIT" =~ ^[0-9]+$ ]] && (( LIMIT >= 1 && LIMIT <= 200 ))
          if [[ -n "$MEDIA_IDS" ]]; then
            if [[ "$MEDIA_IDS" == "all" ]]; then
              test "$OPERATION" = "edge-smoke"
            else
              [[ "$OPERATION" == "rebuild" || "$OPERATION" == "edge-smoke" ]]
              IFS=, read -ra media_ids <<< "$MEDIA_IDS"
              (( ${#media_ids[@]} >= 1 && ${#media_ids[@]} <= 200 ))
              for media_id in "${media_ids[@]}"; do [[ "$media_id" =~ ^[1-9][0-9]*$ ]]; done
            fi
          fi
          test -n "$LIVE_HOST" && test -n "$LIVE_USER" && test -n "$LIVE_PATH" && test -n "$LIVE_SSH_PRIVATE_KEY"

      - name: Install live deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$LIVE_SSH_PRIVATE_KEY" > ~/.ssh/zulors_live_deploy
          chmod 600 ~/.ssh/zulors_live_deploy

      - name: Run bounded HLS operation on live
        run: |
          ssh -i ~/.ssh/zulors_live_deploy -p "$LIVE_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 "$LIVE_USER@$LIVE_HOST" \
            "bash -s -- '$LIVE_PATH' '$OPERATION' '$LIMIT' '$MEDIA_IDS'" <<'REMOTE'
          set -euo pipefail
          live_path="$1"
          operation="$2"
          limit="$3"
          media_ids="$4"
          cd "$live_path"

          if [[ "$operation" == "access-audit" ]]; then
            printf 'ssh_user=%s\n' "$(id -un)"
            printf 'uid=%s\n' "$(id -u)"
            printf 'groups=%s\n' "$(id -Gn)"
            if [[ "$(id -u)" == 0 ]]; then echo 'root=yes'; else echo 'root=no'; fi
            if sudo -n true >/dev/null 2>&1; then echo 'passwordless_sudo=yes'; else echo 'passwordless_sudo=no'; fi
            if [[ -w "$live_path" ]]; then echo 'deploy_path_writable=yes'; else echo 'deploy_path_writable=no'; fi
            exit
          fi

          if [[ "$operation" == "worker-audit" ]]; then
            echo '--- queue processes (pid ppid user elapsed state command) ---'
            ps -eo pid=,ppid=,user=,etime=,stat=,comm=,args= \
              | awk '$0 ~ /artisan (horizon|queue:work)/ && $0 !~ /awk/ {print}'
            echo '--- Horizon status ---'
            if php artisan horizon:status --no-ansi 2>&1; then
              true
            else
              echo 'horizon_status_command=inactive_or_unavailable'
            fi
            echo '--- Supervisor configuration filenames ---'
            for config_dir in /etc/supervisor/conf.d /etc/supervisord.d; do
              if [[ -d "$config_dir" ]]; then
                find "$config_dir" -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort
              fi
            done
            echo '--- service state ---'
            for service in supervisor supervisord; do
              if command -v systemctl >/dev/null 2>&1; then
                printf '%s=' "$service"
                systemctl is-active "$service" 2>/dev/null || true
              fi
            done
            exit
          fi

          if [[ "$operation" == "backfill" ]]; then
            php artisan media:reconcile-reel-hls --missing-only --limit="$limit" --no-ansi
            exit
          fi

          if [[ "$operation" == "rebuild" ]]; then
            if [[ -n "$media_ids" ]]; then
              IFS=, read -ra selected_ids <<< "$media_ids"
              media_id_args=()
              for media_id in "${selected_ids[@]}"; do media_id_args+=(--media-id="$media_id"); done
              php artisan media:reconcile-reel-hls "${media_id_args[@]}" --limit="$limit" --no-ansi
            else
              php artisan media:reconcile-reel-hls --rebuild --limit="$limit" --no-ansi
            fi
            exit
          fi

          if [[ "$operation" == "edge-smoke" ]]; then
            target_info="$(MEDIA_IDS="$media_ids" php -r '
              require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              $query = \App\Models\Media::query()
                  ->where("type", \App\Enums\Media\MediaType::VIDEO->value)
                  ->where("status", \App\Enums\Media\MediaStatus::PROCESSED->value)
                  ->where("mediaable_type", \App\Models\Post::class)
                  ->where("metadata->provider", "r2")
                  ->where("metadata->playback->hls_state", "ready");
              $requested = (string) getenv("MEDIA_IDS");
              $ids = $requested === "all" ? [] : array_filter(array_map("intval", explode(",", $requested)));
              if ($ids) $query->whereIn("id", $ids);
              foreach ($query->orderBy("id")->get(["id", "metadata"]) as $media) {
                  $url = (string) data_get($media->metadata, "playback.hls");
                  if ($url !== "") echo (int) $media->id."\t".$url.PHP_EOL;
              }
            ' )"
            test -n "$target_info"
            work_dir="$(mktemp -d)"
            trap 'rm -rf "$work_dir"' EXIT

            probe_asset() {
              local label="$1" url="$2" body="$3" headers="$4" result code ttfb bytes cache content_type cache_control
              result="$(curl -sS --max-time 25 -D "$headers" -o "$body" -w '%{http_code} %{time_starttransfer} %{size_download}' "$url")"
              read -r code ttfb bytes <<< "$result"
              cache="$(awk 'tolower($1)=="cf-cache-status:" {gsub(/\r/, "", $2); value=$2} END {print value ? value : "missing"}' "$headers")"
              content_type="$(awk 'tolower($1)=="content-type:" {gsub(/\r/, "", $2); value=$2} END {print value ? value : "missing"}' "$headers")"
              cache_control="$(awk 'tolower($1)=="cache-control:" {$1=""; sub(/^[[:space:]]+/, ""); gsub(/\r/, ""); value=$0} END {gsub(/[[:space:]]+/, "_", value); print value ? value : "missing"}' "$headers")"
              printf '%s http=%s ttfb=%ss bytes=%s cf-cache=%s content-type=%s cache-control=%s\n' \
                "$label" "$code" "$ttfb" "$bytes" "$cache" "$content_type" "$cache_control"
              test "$code" = 200
            }

            video_count=0
            while IFS=$'\t' read -r target_media_id master_url; do
              [[ -n "$target_media_id" && -n "$master_url" ]] || continue
              video_count=$((video_count + 1))
              printf 'edge_smoke_media_id=%s\n' "$target_media_id"
              master_file="$work_dir/$target_media_id-master.m3u8"
              probe_asset "media-$target_media_id-master" "$master_url" "$master_file" "$work_dir/$target_media_id-master.headers"
              ladder="$(awk '/^#EXT-X-STREAM-INF:/ {attributes=$0; next} attributes && NF && $0 !~ /^#/ {match(attributes, /RESOLUTION=[0-9]+x[0-9]+/); resolution=substr(attributes, RSTART + 11, RLENGTH - 11); match(attributes, /AVERAGE-BANDWIDTH=[0-9]+/); average=substr(attributes, RSTART + 18, RLENGTH - 18); print resolution "\t" average "\t" $0; attributes=""}' "$master_file")"
              test -n "$ladder"
              rendition_count=0
              rendition_list=()
              while IFS=$'\t' read -r resolution average_bitrate variant_path; do
                [[ -n "$resolution" && -n "$variant_path" ]] || continue
                width="${resolution%%x*}"
                height="${resolution#*x}"
                if (( width < height )); then short_edge="$width"; else short_edge="$height"; fi
                rendition_count=$((rendition_count + 1))
                rendition_list+=("${short_edge}p:${average_bitrate}bps")
                variant_url="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.urljoin(sys.argv[1],sys.argv[2]))' "$master_url" "$variant_path")"
                variant_file="$work_dir/$target_media_id-$short_edge.m3u8"
                probe_asset "media-$target_media_id-${short_edge}p-playlist" "$variant_url" "$variant_file" "$work_dir/$target_media_id-$short_edge.headers"
                segment_path="$(awk 'NF && $0 !~ /^#/ {print; exit}' "$variant_file")"
                test -n "$segment_path"
                segment_url="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.urljoin(sys.argv[1],sys.argv[2]))' "$variant_url" "$segment_path")"
                segment_file=/dev/null
                if (( short_edge <= 480 )); then segment_file="$work_dir/$target_media_id-$short_edge-segment.ts"; fi
                probe_asset "media-$target_media_id-${short_edge}p-segment" "$segment_url" "$segment_file" "$work_dir/$target_media_id-$short_edge-segment.headers"
                if (( short_edge <= 480 )); then
                  decoded_dimensions="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$segment_file")"
                  test "$decoded_dimensions" = "$resolution"
                  ffmpeg -hide_banner -loglevel error -xerror -i "$segment_file" -map 0:v:0 -f null -
                  printf 'sd_decode=pass media_id=%s rung=%sp dimensions=%s average_bitrate=%sbps\n' \
                    "$target_media_id" "$short_edge" "$decoded_dimensions" "$average_bitrate"
                fi
              done <<< "$ladder"
              (( rendition_count > 0 ))
              printf 'edge_smoke_video_result=pass media_id=%s renditions=%s ladder=%s\n' \
                "$target_media_id" "$rendition_count" "$(IFS=,; echo "${rendition_list[*]}")"
            done <<< "$target_info"
            test "$video_count" -gt 0
            printf 'edge_smoke_videos=%s result=pass\n' "$video_count"
            exit
          fi

          if [[ "$operation" == "auth-smoke" ]]; then
            php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $post = App\Models\Post::query()
              ->where('status', App\Enums\Post\PostStatus::ACTIVE->value)
              ->whereHas('user', fn ($query) => $query->active())
              ->whereHas('media', fn ($query) => $query
                  ->where('type', App\Enums\Media\MediaType::VIDEO->value)
                  ->where('status', App\Enums\Media\MediaStatus::PROCESSED->value)
                  ->where('metadata->provider', 'r2')
                  ->where('metadata->playback->hls_state', 'ready'))
              ->orderByDesc('id')
              ->first();
          $viewers = App\Models\User::active()
              ->whereRaw('LOWER(email) LIKE ?', ['%.test'])
              ->orderBy('id')
              ->limit(2)
              ->get();
          if (! $post || $viewers->count() < 2) {
              echo json_encode(['ready_hls_post' => (bool) $post, 'test_viewers' => $viewers->count(), 'result' => 'insufficient_test_data']), PHP_EOL;
              exit(2);
          }
          $url = rtrim((string) config('app.url'), '/').'/api/timeline/post/'.rawurlencode((string) $post->hash_id);
          $failures = 0;
          foreach ($viewers as $index => $viewer) {
              $temporaryToken = $viewer->createToken('temporary-reel-hls-live-smoke');
              try {
                  $response = Illuminate\Support\Facades\Http::withToken($temporaryToken->plainTextToken)
                      ->acceptJson()
                      ->timeout(20)
                      ->get($url, ['without_comments' => 1]);
                  $media = (array) $response->json('data.post.relations.media', []);
                  $hlsCount = collect($media)->filter(fn ($item) => filled(data_get($item, 'metadata.playback.hls')))->count();
                  $passed = $response->successful() && $hlsCount > 0;
                  if (! $passed) $failures++;
                  echo json_encode(['viewer' => $index + 1, 'http' => $response->status(), 'hls_urls' => $hlsCount, 'result' => $passed ? 'pass' : 'fail']), PHP_EOL;
              } catch (Throwable $exception) {
                  $failures++;
                  echo json_encode(['viewer' => $index + 1, 'result' => 'request_error', 'type' => $exception::class]), PHP_EOL;
              } finally {
                  $temporaryToken->accessToken->delete();
              }
          }
          exit($failures ? 1 : 0);
          PHP
            exit
          fi

          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $items = App\Models\Media::query()
              ->where('type', App\Enums\Media\MediaType::VIDEO->value)
              ->where('status', App\Enums\Media\MediaStatus::PROCESSED->value)
              ->where('mediaable_type', App\Models\Post::class)
              ->where('metadata->provider', 'r2')
              ->get(['id', 'mediaable_id', 'metadata', 'size']);
          $counts = [
              'total' => $items->count(),
              'active_test_accounts' => App\Models\User::active()->whereRaw('LOWER(email) LIKE ?', ['%.test'])->count(),
              'hls_state' => ['ready' => 0, 'unset' => 0, 'queued' => 0, 'processing' => 0, 'failed' => 0, 'skipped' => 0, 'other' => 0],
              'background_state' => ['ready' => 0, 'unset' => 0, 'queued' => 0, 'processing' => 0, 'failed' => 0, 'skipped' => 0, 'other' => 0],
              'hls_background_pairs' => [],
              'hls_job_progress' => ['queued_max_age_minutes' => 0, 'background_queued_max_age_minutes' => 0, 'processing_progress' => null, 'processing_source_bytes' => null, 'processing_last_update_age_minutes' => null],
              'current_encoding' => 0,
              'backfill_candidate_count' => 0,
              'backfill_candidates' => [],
          ];
          foreach ($items as $item) {
              $metadata = $item->metadata ?? [];
              $hlsState = data_get($metadata, 'playback.hls_state') ?: 'unset';
              $backgroundState = data_get($metadata, 'background_processing_state') ?: 'unset';
              $pair = $hlsState.'|'.$backgroundState;
              $counts['hls_background_pairs'][$pair] = ($counts['hls_background_pairs'][$pair] ?? 0) + 1;
              $updatedAt = data_get($metadata, 'background_processing_updated_at');
              $updateAge = filled($updatedAt) ? abs(now()->diffInMinutes(\Illuminate\Support\Carbon::parse($updatedAt))) : null;
              if ($hlsState === 'queued' && $updateAge !== null) {
                  $counts['hls_job_progress']['queued_max_age_minutes'] = max($counts['hls_job_progress']['queued_max_age_minutes'], $updateAge);
              }
              if ($backgroundState === 'queued' && $updateAge !== null) {
                  $counts['hls_job_progress']['background_queued_max_age_minutes'] = max($counts['hls_job_progress']['background_queued_max_age_minutes'], $updateAge);
              }
              if ($hlsState === 'processing') {
                  $counts['hls_job_progress']['processing_progress'] = (int) data_get($metadata, 'background_processing_progress', 0);
                  $counts['hls_job_progress']['processing_source_bytes'] = (int) $item->size;
                  $counts['hls_job_progress']['processing_last_update_age_minutes'] = $updateAge;
              }
              foreach ([
                  'hls_state' => $hlsState,
                  'background_state' => $backgroundState,
              ] as $field => $value) {
                  $state = $value ?: 'unset';
                  $counts[$field][array_key_exists($state, $counts[$field]) ? $state : 'other']++;
              }
              if (in_array($hlsState, ['unset', 'failed'], true)
                  && ! in_array($backgroundState, ['queued', 'processing'], true)) {
                  $counts['backfill_candidate_count']++;
                  if (count($counts['backfill_candidates']) < 200) {
                      $counts['backfill_candidates'][] = [
                          'media_id' => (int) $item->id,
                          'post_id' => (int) $item->mediaable_id,
                          'hls_state' => $hlsState,
                          'background_state' => $backgroundState,
                      ];
                  }
              }
              if (data_get($metadata, 'playback.encoding_version') === App\Jobs\User\Timeline\GeneratePostVideoHls::ENCODING_VERSION) $counts['current_encoding']++;
          }
          $queueNames = array_values(array_unique(array_filter([
              (string) config('media.queues.video_high'),
              (string) config('media.queues.video'),
              (string) config('media.queues.video_normal'),
          ])));
          $queueConnection = (string) config('media.queue_connection');
          $pendingByQueue = [];
          try {
              $redisQueue = Illuminate\Support\Facades\Queue::connection($queueConnection);
              foreach ($queueNames as $queueName) {
                  $payloads = collect($redisQueue->getConnection()->lrange($redisQueue->getQueue($queueName), 0, 49))
                      ->map(fn ($payload) => json_decode((string) $payload, true))
                      ->filter(fn ($payload) => is_array($payload))
                      ->countBy(fn ($payload) => (string) data_get($payload, 'displayName', data_get($payload, 'job', 'unknown')))
                      ->all();
                  $reservedPayloads = collect($redisQueue->getConnection()->zrange($redisQueue->getQueue($queueName).':reserved', 0, -1))
                      ->map(fn ($payload) => json_decode((string) $payload, true))
                      ->filter(fn ($payload) => is_array($payload))
                      ->map(fn ($payload) => [
                          'class' => (string) data_get($payload, 'displayName', data_get($payload, 'job', 'unknown')),
                          'attempts' => (int) data_get($payload, 'attempts', 0),
                      ])
                      ->values()
                      ->all();
                  $pendingByQueue[$queueName] = [
                      'ready' => (int) $redisQueue->pendingSize($queueName),
                      'delayed' => (int) $redisQueue->delayedSize($queueName),
                      'reserved' => (int) $redisQueue->reservedSize($queueName),
                      'recent_job_classes' => $payloads,
                      'reserved_job_details' => $reservedPayloads,
                  ];
              }
          } catch (Throwable $exception) {
              $pendingByQueue['error'] = $exception::class;
          }
          $processList = (string) shell_exec('ps -eo etime=,pcpu=,pmem=,args= 2>/dev/null');
          $elapsedSeconds = static function (string $value): int {
              $days = 0;
              if (str_contains($value, '-')) [$days, $value] = explode('-', $value, 2);
              $parts = array_map('intval', explode(':', $value));
              $seconds = count($parts) === 3 ? ($parts[0] * 3600) + ($parts[1] * 60) + $parts[2] : (($parts[0] * 60) + ($parts[1] ?? 0));

              return ((int) $days * 86400) + $seconds;
          };
          $processMetrics = ['video_worker_processes' => 0, 'oldest_video_worker_seconds' => 0, 'max_video_worker_cpu_percent' => 0.0, 'ffmpeg_processes' => 0, 'ffprobe_processes' => 0, 'max_ffmpeg_cpu_percent' => 0.0, 'oldest_ffmpeg_seconds' => 0];
          foreach (preg_split('/\\R/', trim($processList)) ?: [] as $processLine) {
              $parts = preg_split('/\\s+/', trim($processLine), 4);
              if (count($parts) < 4) continue;
              [$elapsed, $cpu, $memory, $command] = $parts;
              if (preg_match('/(?:^|\\s)artisan\\s+(?:horizon:work|queue:work)\\b/', $command) && str_contains($command, 'media-video')) {
                  $processMetrics['video_worker_processes']++;
                  $processMetrics['oldest_video_worker_seconds'] = max($processMetrics['oldest_video_worker_seconds'], $elapsedSeconds($elapsed));
                  $processMetrics['max_video_worker_cpu_percent'] = max($processMetrics['max_video_worker_cpu_percent'], (float) $cpu);
              }
              if (preg_match('/(?:^|\\s)(?:\\S*\\/)?ffmpeg(?:\\s|$)/', $command)) {
                  $processMetrics['ffmpeg_processes']++;
                  $processMetrics['max_ffmpeg_cpu_percent'] = max($processMetrics['max_ffmpeg_cpu_percent'], (float) $cpu);
                  $processMetrics['oldest_ffmpeg_seconds'] = max($processMetrics['oldest_ffmpeg_seconds'], $elapsedSeconds($elapsed));
              }
              if (preg_match('/(?:^|\\s)(?:\\S*\\/)?ffprobe(?:\\s|$)/', $command)) $processMetrics['ffprobe_processes']++;
          }
          $recentVideoJobs = app(Laravel\Horizon\Contracts\JobRepository::class)->getRecent()
              ->filter(fn ($job) => str_contains((string) $job->queue, 'media-video'))
              ->groupBy(fn ($job) => $job->name.'|'.$job->status)
              ->map(fn ($jobs) => $jobs->count())
              ->all();
          $horizonStatusOutput = strtolower(trim((string) shell_exec('php artisan horizon:status 2>&1')));
          $processManagerStatus = [
              'supervisorctl' => trim((string) shell_exec('supervisorctl status 2>&1')),
              'supervisorctl_sudo' => trim((string) shell_exec('sudo -n supervisorctl status 2>&1')),
              'supervisor_service' => trim((string) shell_exec('systemctl is-active supervisor 2>&1')),
              'supervisord_service' => trim((string) shell_exec('systemctl is-active supervisord 2>&1')),
          ];
          $supervisorDetails = collect(app(Laravel\Horizon\Contracts\SupervisorRepository::class)->all())
              ->map(fn ($supervisor) => [
                  'status' => $supervisor->status,
                  'queue_processes' => (array) $supervisor->processes,
              ])
              ->values()
              ->all();
          $sourceFiles = glob(storage_path('app/tmp/reel-hls/*/source.*')) ?: [];
          $scratch = ['source_files' => count($sourceFiles), 'source_bytes' => 0, 'largest_source_bytes' => 0, 'free_disk_bytes' => (int) (disk_free_space(storage_path()) ?: 0), 'source_details' => [], 'work_details' => []];
          foreach ($sourceFiles as $sourceFile) {
              $size = (int) (filesize($sourceFile) ?: 0);
              $scratch['source_bytes'] += $size;
              $scratch['largest_source_bytes'] = max($scratch['largest_source_bytes'], $size);
              $scratch['source_details'][] = ['work_id' => basename(dirname($sourceFile)), 'bytes' => $size, 'last_write_age_seconds' => max(0, time() - (int) (filemtime($sourceFile) ?: time()))];
          }
          foreach (glob(storage_path('app/tmp/reel-hls/*'), GLOB_ONLYDIR) ?: [] as $workDirectory) {
              $details = ['work_id' => basename($workDirectory), 'files' => 0, 'segments' => 0, 'playlists' => 0, 'output_bytes' => 0, 'newest_file_age_seconds' => null];
              foreach (new RecursiveIteratorIterator(new RecursiveDirectoryIterator($workDirectory, FilesystemIterator::SKIP_DOTS)) as $entry) {
                  if (! $entry->isFile()) continue;
                  $details['files']++;
                  $details['segments'] += str_ends_with($entry->getFilename(), '.ts') ? 1 : 0;
                  $details['playlists'] += str_ends_with($entry->getFilename(), '.m3u8') ? 1 : 0;
                  $details['output_bytes'] += (int) $entry->getSize();
                  $age = max(0, time() - (int) $entry->getMTime());
                  $details['newest_file_age_seconds'] = $details['newest_file_age_seconds'] === null ? $age : min($details['newest_file_age_seconds'], $age);
              }
              $scratch['work_details'][] = $details;
          }
          $hlsLogEvents = ['started' => 0, 'completed' => 0, 'attempt_failed' => 0, 'job_failed' => 0];
          $hlsLogLatestAt = null;
          foreach (glob(storage_path('logs/performance*.log')) ?: [] as $logFile) {
              foreach (file($logFile, FILE_IGNORE_NEW_LINES | FILE_SKIP_EMPTY_LINES) ?: [] as $logLine) {
                  foreach (array_keys($hlsLogEvents) as $event) {
                      $needle = match ($event) {
                          'started' => 'reel_hls_job_started',
                          'completed' => 'reel_hls_job_completed',
                          'attempt_failed' => 'Reel HLS generation attempt failed.',
                          'job_failed' => 'reel_hls_job_failed',
                      };
                      if (str_contains($logLine, $needle)) {
                          $hlsLogEvents[$event]++;
                          if (preg_match('/^\\[([^]]+)\\]/', $logLine, $matches)) $hlsLogLatestAt = $matches[1];
                      }
                  }
              }
          }
          $counts['video_queue'] = [
              'connection' => $queueConnection,
              'pending_by_queue' => $pendingByQueue,
              'horizon' => str_contains($horizonStatusOutput, 'running') ? 'running' : 'not_running',
              'horizon_status' => substr($horizonStatusOutput, 0, 300),
              'process_manager' => $processManagerStatus,
              'supervisors' => $supervisorDetails,
              'recent_video_jobs' => $recentVideoJobs,
          ] + $processMetrics;
          $counts['worker_scratch'] = $scratch;
          $counts['hls_log_events'] = $hlsLogEvents + ['latest_event_at' => $hlsLogLatestAt];
          $environment = app()->environment();
          $counts['video_timeouts'] = [
              'hls_job_seconds' => max(1800, (int) config('media.reels_hls.timeout_seconds', 21600)),
              'media_video_worker_seconds' => (int) data_get(config('horizon.environments.'.$environment), 'supervisor-media-video.timeout', 0),
              'media_video_high_worker_seconds' => (int) data_get(config('horizon.environments.'.$environment), 'supervisor-media-video-high.timeout', 0),
              'redis_retry_after_seconds' => (int) config('queue.connections.redis.retry_after', 0),
          ];
          echo json_encode($counts, JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR), PHP_EOL;
          PHP
          REMOTE
